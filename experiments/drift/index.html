<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIFT — a generative ambient instrument</title>
<style>
  /* ============================================================
     DRIFT — refined, near-silent UI. The shader is the room;
     the type is the programme note. System fonts only (file://).
     ============================================================ */
  :root{
    --ink:        #ece6d8;
    --ink-dim:    rgba(236,230,216,0.52);
    --ink-faint:  rgba(236,230,216,0.28);
    --hairline:   rgba(236,230,216,0.16);
    --bg:         #05060a;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --mono-caps: "Avenir Next",Avenir,"Segoe UI",Seravek,Verdana,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); }
  body{ font-family:var(--mono-caps); color:var(--ink); }

  canvas#gl{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; }

  /* ---------------- intro ---------------- */
  #intro{
    position:fixed; inset:0; z-index:30; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:0;
    background:radial-gradient(120% 90% at 50% 38%, rgba(10,12,22,0.18), rgba(4,5,9,0.62) 78%);
    transition:opacity 2.6s ease;
  }
  #intro.gone{ opacity:0; pointer-events:none; }
  #intro h1{
    font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,7vw,4.6rem);
    letter-spacing:0.62em; margin:0 0 1.1rem 0.62em; /* left margin compensates tracking */
    animation:rise 2.8s cubic-bezier(.16,.84,.32,1) both;
  }
  #intro .rule{
    width:2.6rem; height:1px; background:var(--hairline); margin:0 0 1.4rem;
    animation:rise 2.8s .25s cubic-bezier(.16,.84,.32,1) both;
  }
  #intro .sub{
    font-family:var(--serif); font-style:italic; font-size:1.02rem; color:var(--ink-dim);
    margin:0 0 4.2rem; letter-spacing:0.04em;
    animation:rise 2.8s .4s cubic-bezier(.16,.84,.32,1) both;
  }
  #intro .cta{
    font-size:0.66rem; letter-spacing:0.42em; text-transform:uppercase; color:var(--ink);
    margin:0 0 1.2rem 0.42em; animation:breathe 4.5s ease-in-out 1.4s infinite, rise 2.8s .6s cubic-bezier(.16,.84,.32,1) both;
  }
  #intro .hint{
    font-size:0.6rem; letter-spacing:0.18em; color:var(--ink-faint); margin:0;
    animation:rise 2.8s .75s cubic-bezier(.16,.84,.32,1) both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
  @keyframes breathe{ 0%,100%{opacity:.95} 50%{opacity:.35} }

  /* ---------------- performance UI (auto-hiding) ---------------- */
  #ui{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:1.6rem 2rem 1.5rem;
    background:linear-gradient(to top, rgba(4,5,9,0.55), rgba(4,5,9,0) 90%);
    opacity:0; transform:translateY(6px);
    transition:opacity 1.1s ease, transform 1.1s ease;
    pointer-events:none;
  }
  body.ui-on #ui{ opacity:1; transform:none; pointer-events:auto; }
  #ui .left{ min-width:0; }
  #moodName{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:1.7rem; line-height:1.1; letter-spacing:0.02em; margin:0 0 .45rem;
    transition:opacity .9s ease;
  }
  #moodName.swap{ opacity:0; }
  #nowLine{
    font-size:0.58rem; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--ink-dim); white-space:nowrap;
  }
  #nowLine .chord{ color:var(--ink); }

  #ui .right{ display:flex; align-items:center; gap:1.5rem; }

  .dots{ display:flex; gap:0.55rem; align-items:center; }
  .dots button{
    appearance:none; border:1px solid var(--hairline); background:transparent;
    width:9px; height:9px; border-radius:50%; padding:0; cursor:pointer;
    transition:background .6s ease, border-color .6s ease, transform .3s ease;
  }
  .dots button:hover{ transform:scale(1.5); border-color:var(--ink-dim); }
  .dots button.on{ background:var(--ink); border-color:var(--ink); }

  .ctl{ display:flex; align-items:center; gap:0.6rem;
        font-size:0.56rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--ink-dim); }

  /* evolve toggle — a thin pill */
  #evolve{
    appearance:none; width:30px; height:14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--hairline); background:transparent; position:relative;
    transition:border-color .5s ease; margin:0;
  }
  #evolve::after{
    content:""; position:absolute; top:2px; left:2px; width:8px; height:8px; border-radius:50%;
    background:var(--ink-dim); transition:left .35s cubic-bezier(.4,0,.2,1), background .35s ease;
  }
  #evolve:checked{ border-color:var(--ink-dim); }
  #evolve:checked::after{ left:18px; background:var(--ink); }

  /* volume — hairline slider */
  #vol{ appearance:none; -webkit-appearance:none; width:96px; height:14px; background:transparent; cursor:pointer; margin:0; }
  #vol::-webkit-slider-runnable-track{ height:1px; background:var(--hairline); }
  #vol::-webkit-slider-thumb{
    -webkit-appearance:none; width:9px; height:9px; border-radius:50%;
    background:var(--ink); margin-top:-4px; transition:transform .25s ease;
  }
  #vol::-webkit-slider-thumb:hover{ transform:scale(1.5); }
  #vol::-moz-range-track{ height:1px; background:var(--hairline); }
  #vol::-moz-range-thumb{ width:9px; height:9px; border:none; border-radius:50%; background:var(--ink); }

  @media (max-width:680px){
    #ui{ padding:1.1rem 1.2rem; }
    #moodName{ font-size:1.3rem; }
    #ui .right{ gap:0.9rem; }
    #vol{ width:64px; }
    #nowLine{ letter-spacing:0.2em; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="intro">
  <h1>DRIFT</h1>
  <div class="rule"></div>
  <p class="sub">a generative ambient instrument</p>
  <p class="cta">press anywhere to begin</p>
  <p class="hint">headphones recommended &nbsp;·&nbsp; keys 1–5 shift the mood &nbsp;·&nbsp; the mouse is light &amp; density &nbsp;·&nbsp; click plays a note</p>
</div>

<div id="ui">
  <div class="left">
    <h2 id="moodName">Dawn</h2>
    <div id="nowLine"><span class="chord" id="chordLabel">—</span>&nbsp;&nbsp;<span id="scaleLabel"></span></div>
  </div>
  <div class="right">
    <div class="dots" id="dots"></div>
    <label class="ctl">evolve <input type="checkbox" id="evolve" checked></label>
    <label class="ctl">vol <input type="range" id="vol" min="0" max="100" value="80"></label>
  </div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   DRIFT — a single-file generative ambient instrument.

   Modules (in order):
     1. utils            — small math / random helpers
     2. theory           — modes, mood definitions, chord engine,
                           voice-leading, melody walker
     3. audio engine     — Web Audio graph: buses, procedural reverb,
                           ping-pong delay, saturation, comp/limiter
     4. voices           — pad ensemble, sub drone, FM bells, grains
     5. conductor        — look-ahead scheduler, macro arc, mood morphs
     6. visuals          — WebGL flow-field shader fed by FFT + events
     7. input / ui       — mouse instrument, keys, auto-hiding chrome
     8. boot             — user-gesture AudioContext handling
   ════════════════════════════════════════════════════════════════════ */

/* ───────────────────────── 1. utils ───────────────────────── */

/** Clamp x into [a, b]. */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
/** Linear interpolation. */
const lerp = (a, b, t) => a + (b - a) * t;
/** Uniform random in [a, b). */
const rand = (a, b) => a + Math.random() * (b - a);
/** MIDI note number → frequency in Hz (A4 = 440). */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
/** Frame-rate independent smoothing factor for a time constant tau. */
const smoothK = (dt, tau) => 1 - Math.exp(-dt / tau);

/**
 * Weighted random pick.
 * @param {Array<[any, number]>} pairs - [value, weight] pairs.
 * @returns {*} one value, or null when all weights are zero.
 */
function weightedPick(pairs) {
  let tot = 0;
  for (const [, w] of pairs) tot += w;
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (const [v, w] of pairs) { r -= w; if (r <= 0) return v; }
  return pairs[pairs.length - 1][0];
}

/* ───────────────────────── 2. theory ───────────────────────── */

/** Scale modes as semitone offsets from the tonic. */
const MODE_TABLE = {
  lydian:     [0, 2, 4, 6, 7, 9, 11],
  dorian:     [0, 2, 3, 5, 7, 9, 10],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  aeolian:    [0, 2, 3, 5, 7, 8, 10],
};

const NOTE_SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NOTE_FLAT  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

/**
 * The five moods. Everything that defines a "world": scale, tempo,
 * harmonic pool (scale degrees + weights), timbres, FX sizes, palette.
 * Continuous values are crossfaded by the conductor; scale/pool swap
 * at the next bar so voice-leading carries us across the seam.
 */
const MOODS = [
  { id:'dawn', name:'Dawn', tag:'first light, lydian gold',
    mode:'lydian', rootPc:2, flats:false, bpm:64, chordBars:4,
    degrees:[[0,3.2],[1,2.2],[4,1.9],[5,1.6],[2,1.1]],
    padCut:[300,3400], padLevel:1.0,
    reverb:{ len:6.0, damp:0.22, pre:0.030, mix:0.70 },
    delay:{ beats:1.5, fb:0.38, mix:0.50 },
    fm:{ ratio:2.0007, index:2.4, tau:2.0, sparkle:0.5 },
    melBase:0.16, shimmer:0.50, subLevel:0.85,
    colA:[0.070,0.060,0.130], colB:[0.930,0.600,0.320], colC:[0.820,0.400,0.480] },

  { id:'submerged', name:'Submerged', tag:'a dorian sea, lit from above',
    mode:'dorian', rootPc:5, flats:true, bpm:48, chordBars:5,
    degrees:[[0,3.0],[3,1.9],[2,1.7],[6,1.5],[1,1.1]],
    padCut:[200,1500], padLevel:1.06,
    reverb:{ len:8.5, damp:0.10, pre:0.045, mix:0.92 },
    delay:{ beats:1.0, fb:0.45, mix:0.35 },
    fm:{ ratio:1.5, index:1.5, tau:2.8, sparkle:0.15 },
    melBase:0.10, shimmer:0.35, subLevel:1.00,
    colA:[0.012,0.040,0.060], colB:[0.070,0.360,0.440], colC:[0.450,0.780,0.740] },

  { id:'static', name:'Static', tag:'sepia drone, almost still',
    mode:'mixolydian', rootPc:0, flats:true, bpm:42, chordBars:8,
    degrees:[[0,5.0],[6,1.6],[3,1.2],[4,0.8]],
    padCut:[260,1900], padLevel:0.95,
    reverb:{ len:7.5, damp:0.16, pre:0.025, mix:0.80 },
    delay:{ beats:1.25, fb:0.30, mix:0.25 },
    fm:{ ratio:3.93, index:1.3, tau:2.4, sparkle:0.3 },
    melBase:0.065, shimmer:0.80, subLevel:0.90,
    colA:[0.055,0.050,0.045], colB:[0.420,0.360,0.280], colC:[0.780,0.740,0.660] },

  { id:'cathedral', name:'Cathedral', tag:'stone, candle, aeolian vault',
    mode:'aeolian', rootPc:9, flats:false, bpm:54, chordBars:6,
    degrees:[[0,3.0],[5,2.0],[2,1.7],[3,1.4],[6,1.3]],
    padCut:[240,2400], padLevel:1.0,
    reverb:{ len:10.0, damp:0.14, pre:0.060, mix:1.00 },
    delay:{ beats:1.5, fb:0.42, mix:0.32 },
    fm:{ ratio:2.9966, index:3.0, tau:3.2, sparkle:0.6 },
    melBase:0.085, shimmer:0.55, subLevel:1.00,
    colA:[0.012,0.020,0.070], colB:[0.130,0.170,0.420], colC:[0.920,0.660,0.340] },

  { id:'departure', name:'Departure', tag:'leaving at dusk, in motion',
    mode:'dorian', rootPc:4, flats:false, bpm:76, chordBars:3,
    degrees:[[0,2.6],[3,2.1],[6,1.9],[2,1.5],[1,1.2]],
    padCut:[340,3800], padLevel:0.95,
    reverb:{ len:4.6, damp:0.30, pre:0.022, mix:0.55 },
    delay:{ beats:0.75, fb:0.55, mix:0.70 },
    fm:{ ratio:2.0, index:2.2, tau:1.0, sparkle:0.4 },
    melBase:0.21, shimmer:0.40, subLevel:0.80,
    colA:[0.075,0.045,0.120], colB:[0.800,0.340,0.180], colC:[0.550,0.450,0.780] },
];

/**
 * Chord engine: walks a weighted graph of diatonic 7th chords inside
 * the current mode. Transition weights favour common tones and root
 * motion by 4th/5th or step — the progression noodles, never jumps.
 */
class Theory {
  constructor() {
    this.curDeg = -1;
    this.curPcs = null;
    this.curRootPc = 0;
    this.applyMood(0);
  }

  /** Swap scale/root/pool. Current chord pcs are kept so the next
   *  voice-leading step glides across the mode change. */
  applyMood(i) {
    const m = MOODS[i];
    this.mood = m;
    this.mode = MODE_TABLE[m.mode];
    this.rootPc = m.rootPc;
    this.pool = m.degrees;
    this.names = m.flats ? NOTE_FLAT : NOTE_SHARP;
  }

  /** Pitch classes of the diatonic 7th chord on scale degree `deg`. */
  chordPcs(deg) {
    return [0, 2, 4, 6].map(k => (this.rootPc + this.mode[(deg + k) % 7]) % 12);
  }

  chordRootPc(deg) { return (this.rootPc + this.mode[deg % 7]) % 12; }

  /** Human-readable chord symbol (Dmaj7, E7, F♯m7 …). */
  chordLabel(deg) {
    const iv = k => (this.mode[(deg + k) % 7] - this.mode[deg % 7] + 12) % 12;
    const i3 = iv(2), i5 = iv(4), i7 = iv(6);
    let q = '';
    if (i3 === 4 && i7 === 11) q = 'maj7';
    else if (i3 === 4 && i7 === 10) q = '7';
    else if (i3 === 3 && i7 === 10) q = (i5 === 6) ? 'm7♭5' : 'm7';
    else if (i3 === 3 && i7 === 11) q = 'mΔ7';
    return this.names[this.chordRootPc(deg)] + q;
  }

  scaleLabel() { return `${this.names[this.rootPc]} ${this.mood.mode}`; }
  scalePcs()   { return this.mode.map(s => (s + this.rootPc) % 12); }

  /**
   * Choose the next chord.
   * weight = pool weight × (1 + 0.45·commonTones) × rootMotionBonus,
   * with the just-played chord heavily discounted.
   * @returns {{pcs:number[], rootPc:number, label:string}}
   */
  next() {
    const cands = [];
    for (const [deg, w0] of this.pool) {
      const pcs = this.chordPcs(deg);
      let w = w0;
      if (this.curPcs) {
        const common = pcs.filter(pc => this.curPcs.includes(pc)).length;
        const d = Math.abs(((this.chordRootPc(deg) - this.curRootPc + 18) % 12) - 6);
        const motion = (d === 5) ? 1.5 : (d > 0 && d <= 2) ? 1.25 : 1.0;
        w *= (1 + 0.45 * common) * motion;
        if (deg === this.curDeg) w *= 0.18;
      }
      cands.push([deg, w]);
    }
    const deg = weightedPick(cands) ?? this.pool[0][0];
    this.curDeg = deg;
    this.curPcs = this.chordPcs(deg);
    this.curRootPc = this.chordRootPc(deg);
    return { pcs: this.curPcs, rootPc: this.curRootPc, label: this.chordLabel(deg) };
  }
}

/** Nearest pitch with class `pc` to `prev`, inside [lo, hi]. */
function nearestPitch(prev, pc, lo, hi) {
  let best = null, bd = 1e9;
  for (let p = pc + 12 * Math.floor((lo - pc) / 12); p <= hi; p += 12) {
    if (p < lo) continue;
    const d = Math.abs(p - prev);
    if (d < bd) { bd = d; best = p; }
  }
  return best ?? clamp(prev, lo, hi);
}

/**
 * Classic nearest-tone voice leading:
 *   1. each voice moves to the closest tone of the new chord
 *      (common tones therefore hold perfectly still),
 *   2. missing chord tones are recovered by re-aiming the doubled
 *      voice whose move costs least,
 *   3. low-register spacing is widened to keep the pads un-muddy.
 * @param {number[]} prev - previous voicing (MIDI), ascending.
 * @param {number[]} pcs  - target chord pitch classes.
 * @returns {number[]} new voicing, ascending, same length as prev.
 */
function leadVoices(prev, pcs, lo, hi) {
  const t = prev.map(p => {
    let best = p, bd = 1e9;
    for (const pc of pcs) {
      const c = nearestPitch(p, pc, lo, hi);
      const d = Math.abs(c - p);
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  });
  // Recover missing chord tones from doubled voices.
  const have = () => new Set(t.map(x => ((x % 12) + 12) % 12));
  for (const pc of pcs) {
    if (have().has(pc)) continue;
    let bi = -1, bc = 1e9, bp = 0;
    t.forEach((x, i) => {
      const dup = t.filter(y => ((y % 12) + 12) % 12 === ((x % 12) + 12) % 12).length > 1;
      if (!dup) return;
      const cand = nearestPitch(prev[i], pc, lo, hi);
      const cost = Math.abs(cand - prev[i]);
      if (cost < bc) { bc = cost; bi = i; bp = cand; }
    });
    if (bi >= 0) t[bi] = bp;
  }
  t.sort((a, b) => a - b);
  // Anti-mud spacing: low voices need wider gaps.
  for (let i = 1; i < t.length; i++) {
    const need = t[i - 1] < 52 ? 5 : t[i - 1] < 60 ? 3 : 1;
    if (t[i] - t[i - 1] < need && t[i] + 12 <= hi) t[i] += 12;
  }
  t.sort((a, b) => a - b);
  return t;
}

/**
 * Melody walker: prefers chord tones and stepwise motion, resolves
 * leaps by a step in the opposite direction (textbook counterpoint
 * tendency rules, loosely applied).
 */
class MelodyWalker {
  constructor() { this.last = 72; this.lastIv = 0; }
  /**
   * @param {number[]} chordPcs - current chord pitch classes.
   * @param {number[]} scalePcs - current scale pitch classes.
   * @param {number} lo @param {number} hi - register window (MIDI).
   * @returns {number} next MIDI pitch.
   */
  next(chordPcs, scalePcs, lo, hi) {
    const pool = Math.random() < 0.72 ? chordPcs : scalePcs;
    const cands = [];
    for (let p = Math.ceil(lo); p <= hi; p++) {
      const pc = ((p % 12) + 12) % 12;
      if (!pool.includes(pc)) continue;
      const iv = p - this.last;
      let w = 1 / Math.pow(1 + Math.abs(iv), 1.35);
      if (Math.abs(this.lastIv) >= 5) {
        if (Math.sign(iv) === -Math.sign(this.lastIv) && Math.abs(iv) <= 2) w *= 3.5;
        else if (Math.abs(iv) > 4) w *= 0.25;
      }
      if (iv === 0) w *= 0.3;
      cands.push([p, w]);
    }
    const p = weightedPick(cands) ?? clamp(this.last, lo, hi);
    this.lastIv = p - this.last;
    this.last = p;
    return p;
  }
}

/* ───────────────────── 3. audio engine / FX ───────────────────── */

/**
 * Owns the AudioContext graph:
 *
 *  pads ─┬→ mix ─→ HP24 ─→ tanh ─→ comp ─→ limiter ─┬→ analyser
 *  bells─┤                                          └→ masterVol → out
 *  sub  ─┤   sends: each bus → delay / reverb at its own level
 *  shim ─┘   delay return also feeds the reverb (depth behind depth)
 *
 * Reverb is a ConvolverNode with a procedurally generated stereo IR
 * (exponentially decaying noise, progressively low-passed so the tail
 * darkens like a real room). Two convolvers crossfade on mood change.
 */
class AudioEngine {
  /** @param {AudioContext} ctx */
  constructor(ctx) {
    this.ctx = ctx;
    const G = v => new GainNode(ctx, { gain: v });

    /* ---- master chain ---- */
    this.mix = G(1);
    this.hp = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 24, Q: 0.5 });
    this.shaper = new WaveShaperNode(ctx, { oversample: '2x', curve: AudioEngine.satCurve(1.5) });
    this.comp = new DynamicsCompressorNode(ctx, { threshold: -22, knee: 18, ratio: 2.2, attack: 0.12, release: 0.45 });
    this.limiter = new DynamicsCompressorNode(ctx, { threshold: -4, knee: 1, ratio: 20, attack: 0.003, release: 0.2 });
    this.masterVol = G(0);          // ramped in at start, slider-controlled
    this.analyser = new AnalyserNode(ctx, { fftSize: 2048, smoothingTimeConstant: 0.82, minDecibels: -90, maxDecibels: -12 });

    this.mix.connect(this.hp); this.hp.connect(this.shaper);
    this.shaper.connect(this.comp); this.comp.connect(this.limiter);
    this.limiter.connect(this.analyser);              // visuals read pre-volume
    this.limiter.connect(this.masterVol);
    this.masterVol.connect(ctx.destination);

    /* ---- layer buses ---- */
    this.padBus  = G(0.36);
    this.melBus  = G(0.50);
    this.subBus  = G(1.00);
    this.shimBus = G(0.40);
    this.padBus.connect(this.mix); this.melBus.connect(this.mix);
    this.subBus.connect(this.mix); this.shimBus.connect(this.mix);

    /* ---- ping-pong delay, tempo-synced ---- */
    this.dIn = G(1);
    this.dl = new DelayNode(ctx, { delayTime: 0.8, maxDelayTime: 3 });
    this.dr = new DelayNode(ctx, { delayTime: 0.8, maxDelayTime: 3 });
    const dampL = new BiquadFilterNode(ctx, { type: 'lowpass', frequency: 2600, Q: 0.5 });
    const dampR = new BiquadFilterNode(ctx, { type: 'lowpass', frequency: 2400, Q: 0.5 });
    const thinL = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 240, Q: 0.5 });
    const thinR = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 240, Q: 0.5 });
    this.fbL = G(0.4); this.fbR = G(0.4);
    const panL = new StereoPannerNode(ctx, { pan: -0.7 });
    const panR = new StereoPannerNode(ctx, { pan:  0.7 });
    this.dRet = G(0.5);
    this.dIn.connect(this.dl);
    this.dl.connect(dampL); dampL.connect(thinL); thinL.connect(this.fbL); this.fbL.connect(this.dr);
    this.dr.connect(dampR); dampR.connect(thinR); thinR.connect(this.fbR); this.fbR.connect(this.dl);
    this.dl.connect(panL); this.dr.connect(panR);
    panL.connect(this.dRet); panR.connect(this.dRet);
    this.dRet.connect(this.mix);

    /* ---- reverb (dual convolver for crossfades) ---- */
    this.rIn = G(1);
    this.pre = new DelayNode(ctx, { delayTime: 0.03, maxDelayTime: 0.3 });
    this.convA = new ConvolverNode(ctx, { disableNormalization: true });
    this.convB = new ConvolverNode(ctx, { disableNormalization: true });
    this.gA = G(1); this.gB = G(0);
    const rHP = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 90, Q: 0.5 });
    const rLP = new BiquadFilterNode(ctx, { type: 'lowpass', frequency: 9500, Q: 0.5 });
    this.rRet = G(0.6);
    this.rIn.connect(this.pre);
    this.pre.connect(this.convA); this.pre.connect(this.convB);
    this.convA.connect(this.gA); this.convB.connect(this.gB);
    this.gA.connect(rHP); this.gB.connect(rHP);
    rHP.connect(rLP); rLP.connect(this.rRet); this.rRet.connect(this.mix);
    this._activeConv = 'A';
    this._irCache = {};

    /* ---- sends ---- */
    const send = (from, to, v) => { const g = G(v); from.connect(g); g.connect(to); return g; };
    send(this.padBus,  this.rIn, 0.50);
    send(this.melBus,  this.rIn, 0.50);
    send(this.shimBus, this.rIn, 0.90);
    send(this.padBus,  this.dIn, 0.08);
    send(this.melBus,  this.dIn, 0.50);
    send(this.shimBus, this.dIn, 0.15);
    send(this.dRet,    this.rIn, 0.30);   // echoes dissolve into the room

    this.setReverbIR(MOODS[0], true);
  }

  /** Gentle tanh saturation curve, normalized to unity at the edges. */
  static satCurve(drive) {
    const n = 1024, c = new Float32Array(n);
    const norm = Math.tanh(drive);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(x * drive) / norm;
    }
    return c;
  }

  /**
   * Build a stereo impulse response: decorrelated noise with a -60 dB
   * exponential decay and a one-pole low-pass whose cutoff falls along
   * the tail (air absorption). Energy-normalized so every room size
   * returns at the same loudness.
   */
  makeIR(seconds, damp) {
    const sr = this.ctx.sampleRate;
    const len = Math.max(sr * 0.5, Math.floor(seconds * sr));
    const buf = this.ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0, sum = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const env = Math.pow(10, -3 * t);                       // -60 dB at the end
        const k = damp + (0.85 - damp) * Math.pow(1 - t, 1.7);  // darkening tail
        lp += k * ((Math.random() * 2 - 1) * env - lp);
        d[i] = lp;
        sum += lp * lp;
      }
      const fadeN = Math.floor(sr * 0.008);                     // soften the onset
      for (let i = 0; i < fadeN; i++) d[i] *= i / fadeN;
      const s = 0.78 / Math.sqrt(sum);                          // per-channel energy target
      for (let i = 0; i < len; i++) d[i] *= s;
    }
    return buf;
  }

  /** Swap room: load IR into the idle convolver and crossfade 7 s. */
  setReverbIR(mood, instant = false) {
    const ir = this._irCache[mood.id] ?? (this._irCache[mood.id] = this.makeIR(mood.reverb.len, mood.reverb.damp));
    const now = this.ctx.currentTime;
    this.pre.delayTime.setTargetAtTime(mood.reverb.pre, now, 1.2);
    if (instant) {
      this.convA.buffer = ir;
      this.gA.gain.setValueAtTime(1, now); this.gB.gain.setValueAtTime(0, now);
      this._activeConv = 'A';
      return;
    }
    const incoming = this._activeConv === 'A' ? this.convB : this.convA;
    const gIn  = this._activeConv === 'A' ? this.gB : this.gA;
    const gOut = this._activeConv === 'A' ? this.gA : this.gB;
    incoming.buffer = ir;
    gIn.gain.setTargetAtTime(1, now, 2.4);
    gOut.gain.setTargetAtTime(0, now, 2.4);
    this._activeConv = this._activeConv === 'A' ? 'B' : 'A';
  }

  /** Smoothly set the user volume (perceptual square law). */
  setVolume(v01, tc = 0.2) {
    this.masterVol.gain.setTargetAtTime(v01 * v01 * 0.95, this.ctx.currentTime, tc);
  }
}

/* ───────────────────────── 4. voices ───────────────────────── */

/**
 * One pad voice = two detuned saws split hard left/right through their
 * own slowly-LFO'd low-pass filters, plus a centered triangle for body.
 * Continuous oscillators: chord changes glide (true legato voice
 * leading — common tones genuinely do not move).
 */
class PadVoice {
  /** @param {AudioEngine} eng @param {number} pan base stereo position */
  constructor(eng, pan) {
    const ctx = eng.ctx, t0 = ctx.currentTime;
    this.eng = eng;
    this.glide = rand(0.30, 0.65);          // per-voice bloom speed
    this.cutMul = rand(0.85, 1.2);          // per-voice filter colour

    const det = rand(5, 9);
    this.oscA = new OscillatorNode(ctx, { type: 'sawtooth', frequency: 110, detune: -det });
    this.oscB = new OscillatorNode(ctx, { type: 'sawtooth', frequency: 110, detune:  det });
    this.oscC = new OscillatorNode(ctx, { type: 'triangle', frequency: 110 });
    const gA = new GainNode(ctx, { gain: 0.30 });
    const gB = new GainNode(ctx, { gain: 0.30 });
    const gC = new GainNode(ctx, { gain: 0.20 });

    this.fL = new BiquadFilterNode(ctx, { type: 'lowpass', frequency: 700, Q: 0.8 });
    this.fR = new BiquadFilterNode(ctx, { type: 'lowpass', frequency: 700, Q: 0.8 });
    const pL = new StereoPannerNode(ctx, { pan: clamp(pan - 0.3, -1, 1) });
    const pR = new StereoPannerNode(ctx, { pan: clamp(pan + 0.3, -1, 1) });

    this.breathe = new GainNode(ctx, { gain: 1 });
    this.env = new GainNode(ctx, { gain: 0 });

    this.oscA.connect(gA); gA.connect(this.fL);
    this.oscB.connect(gB); gB.connect(this.fR);
    this.oscC.connect(gC); gC.connect(this.fL); gC.connect(this.fR);
    this.fL.connect(pL); this.fR.connect(pR);
    pL.connect(this.breathe); pR.connect(this.breathe);
    this.breathe.connect(this.env);
    this.env.connect(eng.padBus);

    // Slow filter sweeps — one LFO per side, never in phase.
    this.lfoL = new OscillatorNode(ctx, { type: 'sine', frequency: rand(0.020, 0.055) });
    this.lfoR = new OscillatorNode(ctx, { type: 'sine', frequency: rand(0.020, 0.055) });
    this.lfoLG = new GainNode(ctx, { gain: 150 });
    this.lfoRG = new GainNode(ctx, { gain: 150 });
    this.lfoL.connect(this.lfoLG); this.lfoLG.connect(this.fL.frequency);
    this.lfoR.connect(this.lfoRG); this.lfoRG.connect(this.fR.frequency);

    // Amplitude "breathing" (±10 %, ~10–25 s periods).
    this.bLfo = new OscillatorNode(ctx, { type: 'sine', frequency: rand(0.04, 0.10) });
    this.bLfoG = new GainNode(ctx, { gain: 0.10 });
    this.bLfo.connect(this.bLfoG); this.bLfoG.connect(this.breathe.gain);

    for (const o of [this.oscA, this.oscB, this.oscC, this.lfoL, this.lfoR, this.bLfo]) o.start(t0);

    this.peak = 0.16 * rand(0.92, 1.08);
    this.active = false;
  }

  /** Glide all three oscillators to a new MIDI pitch at time `when`. */
  setPitch(midi, when) {
    const f = mtof(midi);
    for (const o of [this.oscA, this.oscB, this.oscC])
      o.frequency.setTargetAtTime(f, when, this.glide);
  }

  /** Long-envelope activate / deactivate (layer breathing). */
  setActive(on, when, level = 1) {
    if (on === this.active && on === false) return;
    this.active = on;
    this.env.gain.setTargetAtTime(on ? this.peak * level : 0, when, on ? 1.8 : 3.0);
  }

  /** Retarget the filter cutoff (control-rate, smoothed). */
  setCutoff(hz) {
    const now = this.eng.ctx.currentTime;
    const v = clamp(hz * this.cutMul, 80, 12000);
    this.fL.frequency.setTargetAtTime(v, now, 0.35);
    this.fR.frequency.setTargetAtTime(v, now, 0.35);
    this.lfoLG.gain.setTargetAtTime(v * 0.22, now, 0.5);
    this.lfoRG.gain.setTargetAtTime(v * 0.22, now, 0.5);
  }
}

/** Five pad voices, lowest near center, upper voices spread wide. */
class PadEnsemble {
  /** @param {AudioEngine} eng */
  constructor(eng) {
    this.eng = eng;
    const pans = [0, -0.5, 0.5, -0.75, 0.75];
    this.voices = pans.map(p => new PadVoice(eng, p));
  }
  /**
   * Apply a new voicing. Voices are index-aligned with the ascending
   * voicing array, so "active count" opens the register upward.
   * @param {number[]} voicing ascending MIDI pitches (length 5)
   * @param {number} when audio time @param {number} count active voices
   * @param {number} level mood pad level multiplier
   */
  setChord(voicing, when, count, level) {
    this.voices.forEach((v, i) => {
      v.setPitch(voicing[i], when);
      v.setActive(i < count, when, level);
    });
  }
  setCutoff(hz) { for (const v of this.voices) v.setCutoff(hz); }
}

/** Deep sine drone that follows the chord root. Mono, centered. */
class SubDrone {
  /** @param {AudioEngine} eng */
  constructor(eng) {
    const ctx = eng.ctx;
    this.eng = eng;
    this.osc  = new OscillatorNode(ctx, { type: 'sine', frequency: 55 });
    this.osc2 = new OscillatorNode(ctx, { type: 'sine', frequency: 110 });
    const g2 = new GainNode(ctx, { gain: 0.22 });   // octave partial for small speakers
    this.env = new GainNode(ctx, { gain: 0 });
    this.osc.connect(this.env);
    this.osc2.connect(g2); g2.connect(this.env);
    this.env.connect(eng.subBus);
    this.lfo = new OscillatorNode(ctx, { type: 'sine', frequency: 0.05 });
    this.lfoG = new GainNode(ctx, { gain: 0.012 });
    this.lfo.connect(this.lfoG); this.lfoG.connect(this.env.gain);
    this.osc.start(); this.osc2.start(); this.lfo.start();
  }
  /** Slow tectonic glide to the new root. */
  setRoot(midi, when) {
    const f = mtof(midi);
    this.osc.frequency.setTargetAtTime(f, when, 0.9);
    this.osc2.frequency.setTargetAtTime(f * 2, when, 0.9);
  }
  setLevel(v) {
    this.env.gain.setTargetAtTime(clamp(v, 0, 0.3), this.eng.ctx.currentTime, 1.5);
  }
}

/**
 * FM bell/pluck. 2-op FM: sine carrier, sine modulator at `ratio`,
 * modulation index decaying fast (bright strike → pure tail).
 * All nodes are one-shot and self-disposing.
 * @param {AudioEngine} eng
 * @param {number} midi @param {number} vel 0..1 @param {number} when
 * @param {{ratio:number,index:number,tau:number,sparkle:number}} fm
 * @param {number} bright 0..1 harmonic brightness from the mouse
 */
function playBell(eng, midi, vel, when, fm, bright) {
  const ctx = eng.ctx;
  const f = mtof(midi);
  const fmod = f * fm.ratio;
  // Higher notes ring shorter, like a real instrument.
  const tau = fm.tau * Math.pow(2, (69 - midi) / 26) * rand(0.85, 1.1);
  const idx = fm.index * (0.4 + 0.9 * vel) * (0.55 + 0.75 * bright);

  const mod = new OscillatorNode(ctx, { type: 'sine', frequency: fmod });
  const mg = new GainNode(ctx, { gain: 0 });
  mod.connect(mg);

  const car = new OscillatorNode(ctx, { type: 'sine', frequency: f });
  mg.connect(car.frequency);
  const amp = new GainNode(ctx, { gain: 0 });
  const pan = new StereoPannerNode(ctx, { pan: clamp((midi - 72) / 36, -0.6, 0.6) + rand(-0.25, 0.25) });
  car.connect(amp); amp.connect(pan); pan.connect(eng.melBus);

  const peak = 0.34 * Math.pow(vel, 1.4);
  mg.gain.setValueAtTime(idx * fmod, when);
  mg.gain.setTargetAtTime(idx * fmod * 0.04, when + 0.005, tau * 0.16);
  amp.gain.setValueAtTime(0, when);
  amp.gain.linearRampToValueAtTime(peak, when + 0.006);
  amp.gain.setTargetAtTime(0, when + 0.006, tau);

  const stop = when + Math.min(14, tau * 7 + 0.5);
  car.start(when); mod.start(when);
  car.stop(stop); mod.stop(stop);

  // Optional airy octave partial.
  if (fm.sparkle > 0.05 && vel > 0.3) {
    const c2 = new OscillatorNode(ctx, { type: 'sine', frequency: f * 2, detune: rand(-6, 6) });
    const a2 = new GainNode(ctx, { gain: 0 });
    c2.connect(a2); a2.connect(pan);
    a2.gain.setValueAtTime(0, when);
    a2.gain.linearRampToValueAtTime(peak * 0.16 * fm.sparkle, when + 0.004);
    a2.gain.setTargetAtTime(0, when + 0.004, tau * 0.45);
    c2.start(when); c2.stop(when + tau * 4 + 0.3);
  }
  car.onended = () => { try { amp.disconnect(); pan.disconnect(); mg.disconnect(); } catch (e) {} };
}

/**
 * Granular shimmer: a burst of short enveloped sine grains pitched on
 * high chord tones, scattered in time and stereo, drowned in reverb.
 * @param {AudioEngine} eng @param {number} when
 * @param {number[]} pcs chord pitch classes @param {number} amount 0..1
 */
function shimmerBurst(eng, when, pcs, amount) {
  const ctx = eng.ctx;
  const count = Math.floor(8 + amount * 14);
  const spread = rand(1.4, 3.0);
  for (let i = 0; i < count; i++) {
    const t = when + Math.random() * spread;
    const pc = pcs[Math.floor(Math.random() * pcs.length)];
    let midi = pc + 96;                       // around C7
    if (midi > 103) midi -= 12;
    const dur = rand(0.14, 0.5);
    const osc = new OscillatorNode(ctx, {
      type: Math.random() < 0.5 ? 'sine' : 'triangle',
      frequency: mtof(midi), detune: rand(-12, 12),
    });
    const g = new GainNode(ctx, { gain: 0 });
    const pan = new StereoPannerNode(ctx, { pan: rand(-0.9, 0.9) });
    osc.connect(g); g.connect(pan); pan.connect(eng.shimBus);
    const peak = rand(0.012, 0.05) * (0.5 + amount);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + dur * 0.45);
    g.gain.linearRampToValueAtTime(0, t + dur);
    osc.start(t); osc.stop(t + dur + 0.05);
    osc.onended = () => { try { g.disconnect(); pan.disconnect(); } catch (e) {} };
  }
}

/* ───────────────────────── 5. conductor ───────────────────────── */

/**
 * Macro-structure: intensity breathes over multi-minute arcs.
 * Two incommensurate sines plus a slow random-walk drift — the curve
 * never repeats. A gentle ramp blossoms the first minute.
 */
class Arc {
  constructor() {
    this.t = 0;
    this.p1 = rand(0, 6.28); this.p2 = rand(0, 6.28);
    this.drift = 0; this.driftTarget = 0; this.driftTimer = 0;
    this.frozen = false;
    this.value = 0.3;
  }
  /** @param {number} dt seconds @returns {number} intensity 0..1 */
  update(dt) {
    if (!this.frozen) {
      this.t += dt;
      this.driftTimer -= dt;
      if (this.driftTimer <= 0) { this.driftTarget = rand(-0.18, 0.18); this.driftTimer = rand(35, 70); }
      this.drift += (this.driftTarget - this.drift) * smoothK(dt, 22);
      const base = 0.5
        + 0.27 * Math.sin(2 * Math.PI * this.t / 241 + this.p1)
        + 0.17 * Math.sin(2 * Math.PI * this.t / 97.3 + this.p2)
        + this.drift;
      const opening = 0.18 + 0.82 * Math.min(1, this.t / 55);
      this.value = clamp(base, 0.06, 1) * opening;
    }
    return this.value;
  }
}

const LOOKAHEAD = 1.6;   // s of audio scheduled ahead (survives bg-tab timer throttling)
const TICK_MS = 150;

/**
 * The conductor: owns musical time (look-ahead scheduler), the chord
 * engine, the macro arc, mouse-derived performance params, and the
 * smooth crossfade between mood parameter sets.
 */
class Conductor {
  /**
   * @param {AudioEngine} eng
   * @param {(ev:object)=>void} onEvent visual/UI event sink
   */
  constructor(eng, onEvent) {
    this.eng = eng;
    this.onEvent = onEvent;
    this.theory = new Theory();
    this.walker = new MelodyWalker();
    this.arc = new Arc();

    this.pads = new PadEnsemble(eng);
    this.sub = new SubDrone(eng);

    this.moodIdx = 0;
    this.pendingMood = null;
    this.cur = this.snapshotParams(MOODS[0]);   // continuous params, lerped

    this.step = 0; this.bar = -1;
    this.barsLeft = 0;
    this.chord = null;
    this.voicing = [45, 52, 59, 64, 71];

    this.phraseLeft = 5; this.restUntil = 0;

    // Mouse instrument state (raw targets + smoothed values).
    this.densRaw = 0.5; this.brightRaw = 0.5;
    this.densS = 0.5; this.brightS = 0.5;
    this.lastMouseT = performance.now();

    this.intensity = 0.25;
    this.running = false;
  }

  /** Continuous (crossfadable) parameter snapshot of a mood. */
  snapshotParams(m) {
    return {
      bpm: m.bpm, padCutLo: m.padCut[0], padCutHi: m.padCut[1], padLevel: m.padLevel,
      revMix: m.reverb.mix, delayBeats: m.delay.beats, delayFb: m.delay.fb, delayMix: m.delay.mix,
      fmRatio: m.fm.ratio, fmIndex: m.fm.index, fmTau: m.fm.tau, sparkle: m.fm.sparkle,
      melBase: m.melBase, shimmer: m.shimmer, subLevel: m.subLevel,
      colA: m.colA.slice(), colB: m.colB.slice(), colC: m.colC.slice(),
    };
  }

  start() {
    const now = this.eng.ctx.currentTime;
    this.nextStep = now + 0.10;
    this._pt = performance.now();
    this.running = true;
    this.timer = setInterval(() => this.tick(), TICK_MS);
    this.tick();
  }

  /** Request a mood change: timbres/FX morph now, scale at next bar. */
  setMood(i) {
    if (i === this.moodIdx && this.pendingMood === null) return;
    this.moodIdx = i;
    this.pendingMood = i;
    this.eng.setReverbIR(MOODS[i]);
    this.onEvent({ kind: 'mood', idx: i });
  }

  /** One scheduler tick: morph controls, then fill the look-ahead. */
  tick() {
    if (!this.running) return;
    const nowP = performance.now();
    const dt = clamp((nowP - this._pt) / 1000, 0.01, 0.6);
    this._pt = nowP;
    this.updateControls(dt);
    const now = this.eng.ctx.currentTime;
    let guard = 0;
    while (this.nextStep < now + LOOKAHEAD && guard++ < 96) {
      this.scheduleStep(this.nextStep);
      this.nextStep += (60 / this.cur.bpm) / 2;   // 8th-note grid
      this.step++;
    }
  }

  /** Crossfade continuous params and push them into the audio graph. */
  updateControls(dt) {
    const tgt = this.snapshotParams(MOODS[this.moodIdx]);
    const k = smoothK(dt, 4.0);
    for (const key of Object.keys(tgt)) {
      if (Array.isArray(tgt[key])) {
        for (let i = 0; i < 3; i++) this.cur[key][i] += (tgt[key][i] - this.cur[key][i]) * k;
      } else {
        this.cur[key] += (tgt[key] - this.cur[key]) * k;
      }
    }
    this.intensity = this.arc.update(dt);

    // Mouse smoothing; after 40 s idle, drift back toward the center.
    const idle = (performance.now() - this.lastMouseT) / 1000;
    const dTgt = idle > 40 ? lerp(this.densRaw, 0.5, Math.min(1, (idle - 40) / 30)) : this.densRaw;
    const bTgt = idle > 40 ? lerp(this.brightRaw, 0.5, Math.min(1, (idle - 40) / 30)) : this.brightRaw;
    this.densS += (dTgt - this.densS) * smoothK(dt, 0.8);
    this.brightS += (bTgt - this.brightS) * smoothK(dt, 0.8);

    // Apply to nodes.
    const eng = this.eng, now = eng.ctx.currentTime;
    const b = clamp(0.12 + 0.72 * this.brightS + 0.16 * this.intensity, 0, 1);
    const cut = this.cur.padCutLo * Math.pow(this.cur.padCutHi / this.cur.padCutLo, b);
    this.pads.setCutoff(cut);
    this.sub.setLevel(0.17 * this.cur.subLevel * (0.35 + 0.75 * this.intensity));

    const dTime = clamp(this.cur.delayBeats * 60 / this.cur.bpm, 0.05, 2.8);
    eng.dl.delayTime.setTargetAtTime(dTime, now, 0.8);
    eng.dr.delayTime.setTargetAtTime(dTime, now, 0.8);
    eng.fbL.gain.setTargetAtTime(this.cur.delayFb, now, 0.5);
    eng.fbR.gain.setTargetAtTime(this.cur.delayFb, now, 0.5);
    eng.dRet.gain.setTargetAtTime(0.8 * this.cur.delayMix, now, 0.5);
    eng.rRet.gain.setTargetAtTime(0.62 * this.cur.revMix, now, 0.5);
  }

  /** Schedule everything that falls on one 8th-note step. */
  scheduleStep(t) {
    const stepInBar = this.step % 8;
    if (stepInBar === 0) {
      this.bar++;
      if (this.pendingMood !== null) {       // scale/pool swap on the barline
        this.theory.applyMood(this.pendingMood);
        this.pendingMood = null;
        this.barsLeft = 0;                   // force a chord from the new world
        this.onEvent({ kind: 'scale', label: this.theory.scaleLabel() });
      }
      if (this.barsLeft <= 0) this.chordChange(t);
      this.barsLeft--;

      // Occasional shimmer cloud, denser when the arc is high.
      if (Math.random() < this.cur.shimmer * (0.10 + 0.40 * this.intensity)) {
        shimmerBurst(this.eng, t + rand(0, 1.2), this.chord.pcs, clamp(this.intensity + 0.2, 0, 1));
      }
    }
    this.scheduleMelody(t);
  }

  /** Pick the next chord, lead the voices, move sub + pads. */
  chordChange(t) {
    const ch = this.theory.next();
    this.chord = ch;
    // Harmonic rhythm breathes with intensity (faster when intense).
    this.barsLeft = clamp(Math.round(this.theory.mood.chordBars * (1.35 - 0.7 * this.intensity)), 2, 10);
    const hi = 72 + Math.round(this.intensity * 7);   // register opens upward
    this.voicing = leadVoices(this.voicing, ch.pcs, 43, hi);
    const active = clamp(2 + Math.round(this.intensity * 3.2), 2, 5);
    this.pads.setChord(this.voicing, t, active, this.cur.padLevel);
    this.sub.setRoot(ch.rootPc + 24, t);
    if (Math.random() < 0.30 + 0.40 * this.intensity) {
      shimmerBurst(this.eng, t + rand(0.3, 1.6), ch.pcs, this.intensity * 0.8);
    }
    this.onEvent({ kind: 'chord', t, label: ch.label });
  }

  /** Humanized sparse melody: probability gate + phrase/rest logic. */
  scheduleMelody(t) {
    if (!this.chord) return;
    if (this.step < this.restUntil) return;
    const prob = clamp(
      this.cur.melBase
      * (0.25 + 1.75 * Math.pow(this.densS, 1.3))
      * (0.35 + 1.05 * this.intensity), 0, 0.55);
    if (Math.random() >= prob) return;

    const center = clamp(71 + Math.round((this.brightS - 0.5) * 12 + this.intensity * 4), 60, 86);
    const pitch = this.walker.next(this.chord.pcs, this.theory.scalePcs(), center - 9, center + 10);
    let vel = 0.42 + 0.5 * Math.pow(Math.random(), 1.7);
    if (Math.random() < 0.12) vel = Math.min(1, vel + 0.22);
    const tj = t + 0.012 + Math.random() * 0.03;      // humanly late
    const fm = { ratio: this.cur.fmRatio, index: this.cur.fmIndex, tau: this.cur.fmTau, sparkle: this.cur.sparkle };
    playBell(this.eng, pitch, vel, tj, fm, this.brightS);
    this.onEvent({ kind: 'note', t: tj, vel, pitch });

    // Occasional soft echo note on the next 8th.
    if (Math.random() < 0.18) {
      const p2 = (Math.random() < 0.3 && pitch + 12 < 97) ? pitch + 12 : pitch;
      const t2 = t + (60 / this.cur.bpm) / 2 + 0.01 + Math.random() * 0.02;
      playBell(this.eng, p2, vel * 0.5, t2, fm, this.brightS);
      this.onEvent({ kind: 'note', t: t2, vel: vel * 0.5, pitch: p2 });
    }

    if (--this.phraseLeft <= 0) {            // breathe between phrases
      this.restUntil = this.step + 6 + Math.floor(Math.random() * 14 * (1.4 - 0.7 * this.intensity));
      this.phraseLeft = 3 + Math.floor(Math.random() * 7);
    }
  }

  /**
   * Play a click-note: quantized to the current chord, so any click —
   * or chord of clicks — is harmonically correct.
   * @param {number} y01 0 = bottom of screen, 1 = top.
   */
  clickNote(y01) {
    if (!this.chord) return null;
    const target = 50 + y01 * 36;
    let best = 60, bd = 1e9;
    for (const pc of this.chord.pcs) {
      for (let p = pc + 36; p <= 96; p += 12) {
        const d = Math.abs(p - target);
        if (d < bd) { bd = d; best = p; }
      }
    }
    const vel = rand(0.55, 0.9);
    const when = this.eng.ctx.currentTime + 0.02;
    const fm = { ratio: this.cur.fmRatio, index: this.cur.fmIndex, tau: this.cur.fmTau, sparkle: this.cur.sparkle };
    playBell(this.eng, best, vel, when, fm, this.brightS);
    this.onEvent({ kind: 'note', t: when, vel, pitch: best });
    return best;
  }
}

/* ───────────────────────── 6. visuals ───────────────────────── */

const VERT_SRC = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

/* A slowly flowing field of light: domain-warped fbm, mood palette,
   FFT-driven luminance, hash-grid sparkles on melodic events, click
   ripple rings, vignette, grain, soft tonemap. */
const FRAG_SRC = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime, uBass, uMid, uHigh, uIntensity, uBright, uMelFlash, uChordPulse;
uniform vec3 uColA, uColB, uColC;
uniform vec4 uRipples[8];

float hash21(vec2 p){
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0; float a = 0.5;
  for (int i = 0; i < 4; i++){
    v += a * vnoise(p);
    p = p * 2.07 + vec2(13.7, 9.2);
    a *= 0.5;
  }
  return v;
}

void main(){
  vec2 p = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  float t = uTime * 0.016 * (0.6 + 0.5 * uIntensity);

  // Domain-warped flow.
  vec2 q = vec2(fbm(p * 1.05 + vec2(0.0, t * 0.7)),
                fbm(p * 1.05 + vec2(5.2, -t * 0.55)));
  vec2 r = vec2(fbm(p * 0.95 + q * 1.9 + vec2(1.7, 9.2) + t * 0.30),
                fbm(p * 0.95 + q * 1.9 + vec2(8.3, 2.8) - t * 0.26));
  float f = fbm(p * 1.15 + r * 2.1);

  // Darks dominate; the warm colour lives only on the ridges of the flow.
  float ridge = smoothstep(0.42, 0.96, f);
  vec3 col = mix(uColA * 0.55, uColB, ridge * ridge);
  col = mix(col, uColC, clamp(r.y * r.y * 1.6, 0.0, 1.0) * 0.45 * ridge);

  float lum = (0.30 + 0.62 * uIntensity) * (0.55 + 0.65 * uBass) + uChordPulse * 0.12;
  col *= lum * (0.35 + 1.05 * f);
  col += uColB * 0.05 * uMid;
  col *= mix(vec3(0.92, 0.96, 1.05), vec3(1.06, 1.00, 0.93), uBright);

  // Sparkles, gated by treble energy and melodic flashes.
  vec2 sp = p * 42.0 + vec2(0.0, uTime * 0.45);
  vec2 ci = floor(sp); vec2 cf = fract(sp) - 0.5;
  float h = hash21(ci);
  float tw = 0.5 + 0.5 * sin(uTime * (0.6 + h * 2.4) + h * 61.0);
  float star = smoothstep(0.972, 1.0, h) * pow(tw, 14.0);
  star *= smoothstep(0.45, 0.85, f) * exp(-dot(cf, cf) * 22.0);
  col += vec3(1.0, 0.97, 0.90) * star * (0.25 + 1.5 * uHigh + 2.4 * uMelFlash);

  // Click ripples.
  for (int i = 0; i < 8; i++){
    vec4 rp = uRipples[i];
    if (rp.w > 0.001){
      float dd = distance(p, rp.xy);
      float rad = rp.z * 0.45;
      float ring = exp(-pow((dd - rad) * 9.0, 2.0)) * exp(-rp.z * 1.1) * rp.w;
      col += (uColC * 0.8 + vec3(0.25)) * ring * 0.85;
    }
  }

  col *= 1.0 - 0.45 * dot(p, p);                                  // vignette
  col += (hash21(vUv * uRes + vec2(fract(uTime) * 61.0, 0.0)) - 0.5) * 0.028;  // grain
  col = col / (1.0 + col);                                        // soft tonemap
  col = pow(max(col, 0.0), vec3(0.86));
  gl_FragColor = vec4(col, 1.0);
}
`;

/** WebGL renderer with adaptive resolution for mid-range machines. */
class Visuals {
  /** @param {HTMLCanvasElement} canvas */
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false })
            || canvas.getContext('experimental-webgl');
    if (!gl) { this.ok = false; return; }
    this.gl = gl;
    this.ok = true;

    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error('shader: ' + gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT_SRC));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG_SRC));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error('link: ' + gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    const buf = gl.createBuffer();                       // fullscreen triangle
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    this.u = {};
    for (const n of ['uRes','uTime','uBass','uMid','uHigh','uIntensity','uBright','uMelFlash','uChordPulse','uColA','uColB','uColC','uRipples'])
      this.u[n] = gl.getUniformLocation(prog, n);

    this.scale = Math.min(window.devicePixelRatio || 1, 1.5);
    this.maxScale = this.scale;
    this._frameAvg = 16;
    this._adaptCount = 0;
    this.rippleData = new Float32Array(32);
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    if (!this.ok) return;
    const w = window.innerWidth, h = window.innerHeight;
    let s = this.scale;
    const px = w * h * s * s;
    if (px > 1.7e6) s *= Math.sqrt(1.7e6 / px);          // pixel budget
    this.canvas.width = Math.max(2, Math.round(w * s));
    this.canvas.height = Math.max(2, Math.round(h * s));
    this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
  }

  /**
   * Adaptive resolution (mid-range GPU guard). Frames over 80 ms are
   * tab-throttling or one-off hiccups, not steady GPU load — ignored.
   * Recovers slowly when frames are comfortably fast again.
   */
  adapt(frameMs) {
    if (frameMs > 80) return;
    this._frameAvg = lerp(this._frameAvg, frameMs, 0.05);
    if (++this._adaptCount < 90) return;          // re-evaluate every ~1.5 s
    this._adaptCount = 0;
    if (this._frameAvg > 34 && this.scale > 0.5) {
      this.scale *= 0.85; this._frameAvg = 20; this.resize();
    } else if (this._frameAvg < 17 && this.scale < this.maxScale) {
      this.scale = Math.min(this.maxScale, this.scale * 1.08); this.resize();
    }
  }

  /**
   * @param {object} s frame state: time, bands, intensity, colors,
   *                  ripples [{x,y,age,amp}], melFlash, chordPulse
   */
  draw(s) {
    if (!this.ok) return;
    const gl = this.gl, u = this.u;
    gl.uniform2f(u.uRes, this.canvas.width, this.canvas.height);
    gl.uniform1f(u.uTime, s.time);
    gl.uniform1f(u.uBass, s.bass); gl.uniform1f(u.uMid, s.mid); gl.uniform1f(u.uHigh, s.high);
    gl.uniform1f(u.uIntensity, s.intensity);
    gl.uniform1f(u.uBright, s.bright);
    gl.uniform1f(u.uMelFlash, s.melFlash);
    gl.uniform1f(u.uChordPulse, s.chordPulse);
    gl.uniform3fv(u.uColA, s.colA); gl.uniform3fv(u.uColB, s.colB); gl.uniform3fv(u.uColC, s.colC);
    const rd = this.rippleData;
    rd.fill(0);
    for (let i = 0; i < Math.min(8, s.ripples.length); i++) {
      const r = s.ripples[i];
      rd[i * 4] = r.x; rd[i * 4 + 1] = r.y; rd[i * 4 + 2] = r.age; rd[i * 4 + 3] = r.amp;
    }
    gl.uniform4fv(u.uRipples, rd);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

/* ───────────────────── 7. app: input, ui, loop ───────────────────── */

const app = {
  started: false,
  ctx: null, audio: null, conductor: null,
  vis: new Visuals(document.getElementById('gl')),
  // Visual envelope state.
  melFlash: 0, chordPulse: 0,
  bands: { bass: 0, mid: 0, high: 0 },
  norm: { bass: { lo: 0.72, hi: 0.95 }, mid: { lo: 0.45, hi: 0.8 }, high: { lo: 0.05, hi: 0.4 } },
  ripples: [],          // {x, y, t0} in shader space
  events: [],           // future audio events awaiting their timestamp
  idleColA: [0.05, 0.05, 0.10], idleColB: [0.16, 0.13, 0.22], idleColC: [0.35, 0.28, 0.38],
  spec: null,
  t0: performance.now(),
  lastFrame: performance.now(),
};

/* ----- UI wiring ----- */
const elIntro = document.getElementById('intro');
const elMood = document.getElementById('moodName');
const elChord = document.getElementById('chordLabel');
const elScale = document.getElementById('scaleLabel');
const elVol = document.getElementById('vol');
const elEvolve = document.getElementById('evolve');
const elDots = document.getElementById('dots');

MOODS.forEach((m, i) => {
  const b = document.createElement('button');
  b.title = `${i + 1} · ${m.name}`;
  if (i === 0) b.classList.add('on');
  b.addEventListener('pointerdown', e => { e.stopPropagation(); selectMood(i); });
  elDots.appendChild(b);
});

function uiSetMood(i) {
  elMood.classList.add('swap');
  setTimeout(() => {
    elMood.textContent = MOODS[i].name;
    elMood.title = MOODS[i].tag;
    elMood.classList.remove('swap');
  }, 450);
  [...elDots.children].forEach((d, j) => d.classList.toggle('on', j === i));
}

/** Auto-hiding chrome: visible on movement, gone after 3.8 s of rest. */
let uiTimer = null, uiHover = false;
function pokeUI() {
  document.body.classList.add('ui-on');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => { if (!uiHover) document.body.classList.remove('ui-on'); }, 3800);
}
document.getElementById('ui').addEventListener('pointerenter', () => { uiHover = true; });
document.getElementById('ui').addEventListener('pointerleave', () => { uiHover = false; pokeUI(); });

elVol.addEventListener('input', () => { if (app.audio) app.audio.setVolume(elVol.value / 100); });
elEvolve.addEventListener('change', () => { if (app.conductor) app.conductor.arc.frozen = !elEvolve.checked; });
document.getElementById('ui').addEventListener('pointerdown', e => e.stopPropagation());

function selectMood(i) {
  uiSetMood(i);
  if (app.conductor) app.conductor.setMood(i);
}

/* ----- mouse instrument ----- */
window.addEventListener('pointermove', e => {
  pokeUI();
  if (!app.conductor) return;
  app.conductor.densRaw = clamp(e.clientX / window.innerWidth, 0, 1);
  app.conductor.brightRaw = clamp(1 - e.clientY / window.innerHeight, 0, 1);
  app.conductor.lastMouseT = performance.now();
});

window.addEventListener('pointerdown', e => {
  pokeUI();
  if (!app.started) { begin(); return; }       // the founding gesture is silent
  if (app.ctx.state !== 'running') app.ctx.resume();
  const y01 = clamp(1 - e.clientY / window.innerHeight, 0, 1);
  app.conductor.clickNote(y01);
  addRipple(e.clientX, e.clientY, 1.0);
});

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) {
    if (!app.started) { begin(n - 1); return; }
    selectMood(n - 1);
    pokeUI();
  }
});

/** Convert a client-space point to shader space and store a ripple. */
function addRipple(cx, cy, amp) {
  const w = window.innerWidth, h = window.innerHeight;
  const x = (cx / w - 0.5) * (w / h);
  const y = 0.5 - cy / h;
  if (app.ripples.length >= 8) app.ripples.shift();
  app.ripples.push({ x, y, t0: performance.now() / 1000, amp });
}

/* ----- audio-event sink (conductor → visuals/UI) ----- */
function onMusicEvent(ev) {
  if (ev.kind === 'chord') { app.events.push(ev); elChord.textContent = ev.label; }
  else if (ev.kind === 'note') app.events.push(ev);
  else if (ev.kind === 'scale') elScale.textContent = ev.label;
  else if (ev.kind === 'mood') uiSetMood(ev.idx);
}

/* ----- boot: AudioContext needs a user gesture ----- */
function begin(moodIdx = 0) {
  if (app.started) return;
  app.started = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  app.ctx = new AC({ latencyHint: 'playback' });
  app.ctx.resume();
  app.audio = new AudioEngine(app.ctx);
  app.audio.setVolume(0);                              // start silent…
  app.conductor = new Conductor(app.audio, onMusicEvent);
  if (moodIdx !== 0) { app.conductor.moodIdx = moodIdx; app.conductor.theory.applyMood(moodIdx); app.conductor.cur = app.conductor.snapshotParams(MOODS[moodIdx]); app.audio.setReverbIR(MOODS[moodIdx], true); uiSetMood(moodIdx); }
  app.conductor.start();
  elScale.textContent = app.conductor.theory.scaleLabel();
  app.spec = new Uint8Array(app.audio.analyser.frequencyBinCount);
  // …then breathe in over ~5 s while the intro dissolves.
  const target = (elVol.value / 100);
  app.audio.masterVol.gain.setTargetAtTime(target * target * 0.95, app.ctx.currentTime + 0.1, 2.0);
  elIntro.classList.add('gone');
  setTimeout(() => elIntro.remove(), 3000);
  pokeUI();
  // Keep the context alive across tab switches / OS interruptions.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && app.ctx.state !== 'running') app.ctx.resume();
  });
}

/* ----- band analysis: FFT → smoothed envelopes for the shader ----- */
function analyse(dt) {
  if (!app.audio) return;
  const an = app.audio.analyser;
  an.getByteFrequencyData(app.spec);
  const sr = app.ctx.sampleRate, binHz = sr / an.fftSize;
  const band = (lo, hi) => {
    const a = Math.max(1, Math.round(lo / binHz)), b = Math.min(app.spec.length - 1, Math.round(hi / binHz));
    let s = 0; for (let i = a; i <= b; i++) s += app.spec[i];
    return s / ((b - a + 1) * 255);
  };
  // Adaptive normalization: track a sliding floor/ceiling per band and
  // map between them, so the envelopes follow the *movement* of each
  // layer (pad swells, bell strikes) rather than its absolute level —
  // the sub drone would otherwise pin the low bins to the ceiling.
  const autoNorm = (st, v) => {
    if (v < st.lo) st.lo = v; else st.lo += (v - st.lo) * smoothK(dt, 9);
    if (v > st.hi) st.hi = v; else st.hi += (v - st.hi) * smoothK(dt, 16);
    return clamp((v - st.lo) / Math.max(0.04, st.hi - st.lo), 0, 1);
  };
  const raw = { bass: band(30, 170), mid: band(200, 1000), high: band(2000, 8000) };
  for (const k of ['bass', 'mid', 'high']) {
    const v = autoNorm(app.norm[k], raw[k]), cur = app.bands[k];
    app.bands[k] = v > cur ? lerp(cur, v, smoothK(dt, 0.05)) : lerp(cur, v, smoothK(dt, 0.45));
  }
}

/* ----- render loop ----- */
function frame() {
  requestAnimationFrame(frame);
  const nowP = performance.now();
  const dt = clamp((nowP - app.lastFrame) / 1000, 0.001, 0.1);
  const frameMs = nowP - app.lastFrame;
  app.lastFrame = nowP;
  const time = (nowP - app.t0) / 1000;

  // Consume scheduled music events whose audio time has arrived.
  if (app.ctx) {
    const at = app.ctx.currentTime + 0.03;
    while (app.events.length && app.events[0].t <= at) {
      const ev = app.events.shift();
      if (ev.kind === 'note') app.melFlash = Math.min(1, app.melFlash + 0.45 * (ev.vel ?? 0.5));
      else if (ev.kind === 'chord') app.chordPulse = 1;
    }
    // Events can arrive slightly out of order; keep the queue sorted.
    if (app.events.length > 1) app.events.sort((a, b) => a.t - b.t);
  }
  app.melFlash *= Math.exp(-dt * 2.4);
  app.chordPulse *= Math.exp(-dt * 0.55);
  analyse(dt);

  const c = app.conductor;
  const ripNow = nowP / 1000;
  app.ripples = app.ripples.filter(r => ripNow - r.t0 < 4.5);

  app.vis.adapt(frameMs);
  app.vis.draw({
    time,
    bass: app.bands.bass, mid: app.bands.mid, high: app.bands.high,
    intensity: c ? c.intensity : 0.22 + 0.06 * Math.sin(time * 0.1),
    bright: c ? c.brightS : 0.5,
    melFlash: app.melFlash, chordPulse: app.chordPulse,
    colA: c ? c.cur.colA : app.idleColA,
    colB: c ? c.cur.colB : app.idleColB,
    colC: c ? c.cur.colC : app.idleColC,
    ripples: app.ripples.map(r => ({ x: r.x, y: r.y, age: ripNow - r.t0, amp: r.amp })),
  });
}
frame();
pokeUI();
</script>
</body>
</html>
